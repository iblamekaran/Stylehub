<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — StyleHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">StyleHub</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html#catalog">Catalog</a>
        <a href="about.html">About</a>
        <a href="account.html">Account</a>
        <a href="checkout.html">Checkout</a>
      </nav>

      <div class="header-actions">
        <a href="account.html" class="account-status" id="accountStatus">Log in</a>
        <button class="header-logout hidden" id="headerLogout" type="button">Log out</button>
        <button class="cart-toggle" id="cartToggle" aria-haspopup="true" aria-expanded="false" aria-controls="cartDrawer">
          Bag
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>


  <section class="account" id="account">
    <div class="wrap account-inner">
      <h2 class="section-title">Account</h2>


      <div class="auth-panel" id="authPanel">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" type="button">Log in</button>
          <button class="auth-tab" id="tabSignup" type="button">Create account</button>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" required autocomplete="username">
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
          <p class="form-status" id="loginStatus" role="status"></p>
        </form>

        <form id="signupForm" class="auth-form hidden">
          <div class="field">
            <label for="signupUsername">Choose a username</label>
            <input type="text" id="signupUsername" name="username" required autocomplete="username">
          </div>
          <div class="field">
            <label for="signupPassword">Choose a password</label>
            <input type="password" id="signupPassword" name="password" required minlength="4" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
          <p class="form-status" id="signupStatus" role="status"></p>
        </form>
      </div>


      <div class="account-panel hidden" id="accountPanel">
        <div class="account-grid">

          <div class="account-card wallet-card">
            <h3>Wallet balance</h3>
            <p class="wallet-balance" id="walletBalance">₹0</p>
            <div class="field">
              <label for="topUpAmount">Add funds</label>
              <div class="topup-row">
                <input type="number" id="topUpAmount" min="1" placeholder="Amount">
                <button class="btn btn-outline" id="topUpBtn" type="button">Add</button>
              </div>
            </div>
          </div>

          <div class="account-card">
            <h3>Saved address</h3>
            <form id="addressForm" class="auth-form">
              <div class="field">
                <label for="savedAddress">Address</label>
                <textarea id="savedAddress" name="savedAddress" rows="3"></textarea>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="savedCity">City</label>
                  <input type="text" id="savedCity" name="savedCity">
                </div>
                <div class="field">
                  <label for="savedPincode">Pincode</label>
                  <input type="text" id="savedPincode" name="savedPincode" pattern="[0-9]{6}">
                </div>
              </div>
              <button type="submit" class="btn btn-outline btn-block">Save address</button>
              <p class="form-status" id="addressStatus" role="status"></p>
            </form>
          </div>

          <div class="account-card orders-card">
            <h3>Order history</h3>
            <ul class="orders-list" id="ordersList">
              <li class="empty-msg">No orders placed yet.</li>
            </ul>
          </div>

        </div>

        <button class="btn btn-outline" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </section>


  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping bag">
    <div class="cart-drawer-head">
      <h3>Your bag</h3>
      <button class="cart-close" id="cartClose" aria-label="Close bag">&times;</button>
    </div>
    <ul class="cart-items" id="cartItems">
      <li class="empty-msg">Your bag is empty.</li>
    </ul>
    <div class="cart-drawer-foot">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <a href="checkout.html" class="btn btn-primary btn-block" id="goToCheckout">Go to checkout</a>
    </div>
  </aside>


  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>StyleHub</span>
      <span>Front End Engineering-II · Project Evaluation-I</span>
    </div>
  </footer>

  <script type="module" src="./script.js"></script>
</body>
</html>
